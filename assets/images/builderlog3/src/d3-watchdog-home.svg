<svg xmlns="http://www.w3.org/2000/svg" width="680" height="288" viewBox="0 0 680 288" role="img" aria-labelledby="d3-watchdog-title d3-watchdog-desc">
<title id="d3-watchdog-title">에러가 나면 알리는 감시와 실행 기록 감시</title>
<desc id="d3-watchdog-desc">작업이 실행되지 않으면 에러도 알림도 없는 예전 감시와, 작업 스케줄러의 실행 기록이 제때 없으면 그 자체를 알리는 지금 감시를 비교한 흐름.</desc>
<defs>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.lane{font-size:12px;font-weight:600;fill:#4f5d75}
.name{font-size:12px;font-weight:600;fill:#2d3142}
.sub{font-size:12px;fill:#4f5d75}
.lbl{font-size:12px;font-weight:500;fill:#4f5d75}
.lbl-a{font-size:12px;font-weight:500;fill:#eb6c36}
.cap{font-size:12px;fill:#4f5d75}
</style>
<marker id="d3-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="d3-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="680" height="288" fill="#FFFFFF"/>

<!-- lane 1 -->
<text class="lane" x="20" y="32">예전 감시: 에러가 나면 알려 줘</text>
<line x1="180" y1="72" x2="260" y2="72" stroke="#4f5d75" stroke-width="1" marker-end="url(#d3-arr)"/>
<line x1="420" y1="72" x2="500" y2="72" stroke="#4f5d75" stroke-width="1" marker-end="url(#d3-arr)"/>
<rect x="20" y="44" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#2d3142" stroke-width="1"/>
<text class="name" x="100" y="68" text-anchor="middle">작업이 실행되지 않음</text>
<text class="sub" x="100" y="88" text-anchor="middle">실행 조건이 초기화됨</text>
<rect x="260" y="44" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#2d3142" stroke-width="1"/>
<text class="name" x="340" y="68" text-anchor="middle">에러도 안 남</text>
<text class="sub" x="340" y="88" text-anchor="middle">실패할 일이 없으니까</text>
<rect x="500" y="44" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
<text class="name" x="580" y="68" text-anchor="middle">알림 없음</text>
<text class="sub" x="580" y="88" text-anchor="middle">나흘 동안 몰랐다</text>

<line x1="20" y1="124" x2="660" y2="124" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

<!-- lane 2 -->
<text class="lane" x="20" y="152">지금 감시: 성공 기록이 제때 없으면 알려 줘</text>
<line x1="180" y1="192" x2="260" y2="192" stroke="#4f5d75" stroke-width="1" marker-end="url(#d3-arr)"/>
<rect x="192" y="164" width="56" height="16" rx="2" fill="#FFFFFF"/>
<text class="lbl" x="220" y="176" text-anchor="middle">실행하면</text>
<line x1="420" y1="192" x2="500" y2="192" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#d3-arr-a)"/>
<rect x="424" y="164" width="72" height="16" rx="2" fill="#FFFFFF"/>
<text class="lbl-a" x="460" y="176" text-anchor="middle">감시기 확인</text>
<rect x="20" y="164" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#2d3142" stroke-width="1"/>
<text class="name" x="100" y="188" text-anchor="middle">예약 작업</text>
<text class="sub" x="100" y="208" text-anchor="middle">정해진 시간에 실행</text>
<rect x="260" y="164" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#2d3142" stroke-width="1"/>
<text class="name" x="340" y="188" text-anchor="middle">작업 스케줄러 기록</text>
<text class="sub" x="340" y="208" text-anchor="middle">실행 시각과 결과 코드</text>
<rect x="500" y="164" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text class="name" x="580" y="188" text-anchor="middle">기록이 없으면 알림</text>
<text class="sub" x="580" y="208" text-anchor="middle">안 일어난 것도 사건</text>

<text class="cap" x="340" y="264" text-anchor="middle">에러 없이 멈춘 작업까지 잡으려면, 성공 기록이 제때 없는 것 자체를 알린다.</text>
</svg>
