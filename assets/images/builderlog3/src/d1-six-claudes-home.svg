<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="d1-six-claudes-title d1-six-claudes-desc">
<title id="d1-six-claudes-title">클로드 여섯 곳과 통합뇌</title>
<desc id="d1-six-claudes-desc">노트북, 집 PC, 홈서버의 클로드 다섯은 통합뇌 폴더에 연결되어 있고, 웹과 폰의 claude.ai만 통합뇌 밖에 있는 구조.</desc>
<defs>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.name{font-size:12px;font-weight:600;fill:#2d3142}
.hub{font-size:16px;font-weight:600;fill:#2d3142}
.sub{font-size:12px;fill:#4f5d75}
.chip{font-size:12px;fill:#2d3142}
.cap{font-size:12px;fill:#4f5d75}
.leg{font-size:12px;fill:#4f5d75}
</style>
<marker id="d1-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
</defs>
<rect width="680" height="400" fill="#FFFFFF"/>

<!-- connectors first -->
<path d="M264 60 H288 Q296 60 296 68 V128 Q296 136 304 136 H328" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#d1-arr)" marker-end="url(#d1-arr)"/>
<path d="M264 156 H328" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#d1-arr)" marker-end="url(#d1-arr)"/>
<path d="M328 176 H304 Q296 176 296 184 V244 Q296 252 288 252 H264" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#d1-arr)"/>

<!-- 노트북 -->
<rect x="24" y="24" width="240" height="72" rx="6" fill="#FFFFFF" stroke="#2d3142" stroke-width="1"/>
<text class="name" x="40" y="46">노트북</text>
<rect x="40" y="56" width="100" height="28" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
<text class="chip" x="90" y="74" text-anchor="middle">클로드 코웍</text>
<rect x="148" y="56" width="100" height="28" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
<text class="chip" x="198" y="74" text-anchor="middle">클로드 코드</text>

<!-- 집 PC -->
<rect x="24" y="120" width="240" height="72" rx="6" fill="#FFFFFF" stroke="#2d3142" stroke-width="1"/>
<text class="name" x="40" y="142">집 PC</text>
<rect x="40" y="152" width="100" height="28" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
<text class="chip" x="90" y="170" text-anchor="middle">클로드 코웍</text>
<rect x="148" y="152" width="100" height="28" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
<text class="chip" x="198" y="170" text-anchor="middle">클로드 코드</text>

<!-- 홈서버 -->
<rect x="24" y="216" width="240" height="72" rx="6" fill="#FFFFFF" stroke="#2d3142" stroke-width="1"/>
<text class="name" x="40" y="238">홈서버</text>
<text class="sub" x="92" y="238">늘 켜져 있음</text>
<rect x="40" y="248" width="100" height="28" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
<text class="chip" x="90" y="266" text-anchor="middle">클로드 코드</text>

<!-- 통합뇌 hub -->
<rect x="328" y="120" width="160" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#2d3142" stroke-width="1.2"/>
<text class="hub" x="408" y="152" text-anchor="middle">통합뇌</text>
<text class="sub" x="408" y="176" text-anchor="middle">git으로 동기화하는 폴더</text>

<!-- 섬 (focal) -->
<rect x="536" y="112" width="128" height="88" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
<text class="name" x="552" y="136">웹과 폰</text>
<rect x="552" y="148" width="96" height="28" rx="4" fill="#FFFFFF" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
<text class="chip" x="600" y="166" text-anchor="middle">claude.ai</text>
<text class="sub" x="600" y="228" text-anchor="middle">통합뇌에 연결되지 않음</text>
<text class="sub" x="600" y="248" text-anchor="middle">RPM 대화가 남은 곳</text>

<text class="cap" x="340" y="332" text-anchor="middle">통합뇌에 연결된 클로드는 다섯. 폰으로 연 claude.ai만 통합뇌 밖이다.</text>

<!-- legend strip -->
<line x1="24" y1="352" x2="656" y2="352" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<path d="M24 376 H64" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#d1-arr)" marker-end="url(#d1-arr)"/>
<text class="leg" x="72" y="380">읽고 씀</text>
<path d="M156 376 H196" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#d1-arr)"/>
<text class="leg" x="204" y="380">읽기만</text>
<rect x="288" y="368" width="24" height="16" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
<text class="leg" x="320" y="380">통합뇌 밖</text>
</svg>
