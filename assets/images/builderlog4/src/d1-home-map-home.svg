<svg xmlns="http://www.w3.org/2000/svg" width="680" height="448" viewBox="0 0 680 448" role="img" aria-labelledby="d1-home-map-title d1-home-map-desc">
<title id="d1-home-map-title">지금 우리 집 Home Assistant 구조</title>
<desc id="d1-home-map-desc">구글 네스트와 n8n이 입구이고, 가운데 Home Assistant가 아카라, 투야, SmartThings 허브 셋을 묶으며, 자가수리가 감시하고 공유기 사이트 차단은 HA 밖에서 따로 도는 구조.</desc>
<defs>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.name{font-size:12px;font-weight:600;fill:#2d3142}
.hub{font-size:16px;font-weight:600;fill:#2d3142}
.sub{font-size:12px;fill:#4f5d75}
.cap{font-size:12px;fill:#4f5d75}
.leg{font-size:12px;fill:#4f5d75}
</style>
<marker id="d4a-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
</defs>
<rect width="680" height="448" fill="#FFFFFF"/>

<!-- connectors first -->
<path d="M208 88 V112 Q208 120 216 120 H292 Q300 120 300 128 V152" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#d4a-arr)" marker-end="url(#d4a-arr)"/>
<path d="M472 88 V112 Q472 120 464 120 H388 Q380 120 380 128 V152" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#d4a-arr)"/>
<path d="M496 184 H440" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#d4a-arr)"/>
<path d="M292 216 V240 Q292 248 284 248 H124 Q116 248 116 256 V280" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#d4a-arr)" marker-end="url(#d4a-arr)"/>
<path d="M340 216 V280" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#d4a-arr)" marker-end="url(#d4a-arr)"/>
<path d="M388 216 V240 Q388 248 396 248 H556 Q564 248 564 256 V280" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#d4a-arr)" marker-end="url(#d4a-arr)"/>

<!-- 입구 -->
<rect x="128" y="24" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#2d3142" stroke-width="1"/>
<text class="name" x="208" y="50" text-anchor="middle">구글 네스트</text>
<text class="sub" x="208" y="70" text-anchor="middle">말로 부르고 말로 알려줌</text>
<rect x="392" y="24" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#2d3142" stroke-width="1"/>
<text class="name" x="472" y="50" text-anchor="middle">n8n</text>
<text class="sub" x="472" y="70" text-anchor="middle">아카라 기기 상태를 HA로</text>

<!-- HA 밖 -->
<rect x="24" y="156" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
<text class="name" x="104" y="180" text-anchor="middle">공유기 사이트 차단</text>
<text class="sub" x="104" y="200" text-anchor="middle">HA 밖에서 따로</text>

<!-- HA (focal) -->
<rect x="240" y="152" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text class="hub" x="340" y="182" text-anchor="middle">Home Assistant</text>
<text class="sub" x="340" y="204" text-anchor="middle">윈도우 홈서버 위 도커</text>

<!-- 자가수리 -->
<rect x="496" y="156" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#2d3142" stroke-width="1"/>
<text class="name" x="576" y="180" text-anchor="middle">자가수리</text>
<text class="sub" x="576" y="200" text-anchor="middle">토큰 갱신, 멈춤 감시</text>

<!-- 허브 셋 -->
<rect x="24" y="280" width="184" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text class="name" x="116" y="304" text-anchor="middle">아카라 허브</text>
<text class="sub" x="116" y="326" text-anchor="middle">스위치, 도어락, 커튼</text>
<text class="sub" x="116" y="346" text-anchor="middle">기기 14대</text>
<rect x="248" y="280" width="184" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text class="name" x="340" y="304" text-anchor="middle">투야 게이트웨이</text>
<text class="sub" x="340" y="326" text-anchor="middle">난방, 온습도, 움직임 센서</text>
<text class="sub" x="340" y="346" text-anchor="middle">기기 16대</text>
<rect x="472" y="280" width="184" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text class="name" x="564" y="304" text-anchor="middle">SmartThings</text>
<text class="sub" x="564" y="326" text-anchor="middle">에어컨과 가전, 허브 내장</text>
<text class="sub" x="564" y="346" text-anchor="middle">기기 11대</text>

<text class="cap" x="340" y="392" text-anchor="middle">허브 셋은 그대로 두고, 그 위에 Home Assistant 하나를 올렸다. 기기 수는 8월 말 기준.</text>

<!-- legend strip -->
<line x1="24" y1="408" x2="656" y2="408" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<path d="M24 428 H64" fill="none" stroke="#4f5d75" stroke-width="1" marker-start="url(#d4a-arr)" marker-end="url(#d4a-arr)"/>
<text class="leg" x="72" y="432">명령과 상태</text>
<path d="M176 428 H216" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#d4a-arr)"/>
<text class="leg" x="224" y="432">신호 전달</text>
<path d="M312 428 H352" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#d4a-arr)"/>
<text class="leg" x="360" y="432">감시</text>
<rect x="424" y="420" width="24" height="16" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
<text class="leg" x="456" y="432">HA 밖</text>
</svg>
